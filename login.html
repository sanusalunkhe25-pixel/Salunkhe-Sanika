<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Sanika Salunkhe</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #172554
                );

            color: #e5e7eb;

            padding: 20px;
        }


        .login-container {
            width: 90%;

            max-width: 400px;

            padding: 40px;

            background: #111827;

            border: 1px solid #334155;

            border-radius: 12px;

            box-shadow:
                0 0 30px
                rgba(56, 189, 248, 0.2);

            text-align: center;
        }


        /* PROFILE IMAGE */

        .profile-image {
            width: 130px;

            height: 130px;

            object-fit: cover;

            border-radius: 50%;

            border: 4px solid #38bdf8;

            margin-bottom: 20px;

            box-shadow:
                0 0 25px
                rgba(56, 189, 248, 0.35);
        }


        /* NAME */

        h1 {
            color: #38bdf8;

            font-size: 2rem;

            margin-bottom: 5px;
        }


        /* DEVELOPER TITLE */

        .developer-title {
            color: #cbd5e1;

            font-size: 1.1rem;

            margin-bottom: 30px;
        }


        /* FORM */

        .form-group {
            margin-bottom: 20px;

            text-align: left;
        }


        label {
            display: block;

            margin-bottom: 8px;

            color: #cbd5e1;
        }


        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #334155;

            border-radius: 7px;

            outline: none;

            background: #1e293b;

            color: white;

            font-size: 1rem;
        }


        input:focus {
            border-color: #38bdf8;

            box-shadow:
                0 0 5px
                rgba(56, 189, 248, 0.2);
        }


        input::placeholder {
            color: #64748b;
        }


        /* LOGIN BUTTON */

        .login-button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #38bdf8;

            color: #082f49;

            font-size: 1rem;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        .login-button:hover {
            background: #7dd3fc;

            transform: translateY(-2px);
        }


        /* BACK LINK */

        .back-home {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #38bdf8;

            transition: 0.3s;
        }


        .back-home:hover {
            color: #7dd3fc;
        }


        /* MOBILE */

        @media (max-width: 500px) {

            .login-container {
                padding: 30px 25px;
            }


            .profile-image {
                width: 110px;

                height: 110px;
            }


            h1 {
                font-size: 1.7rem;
            }

        }

    </style>

</head>


<body>


    <!-- LOGIN CONTAINER -->

    <div class="login-container">


        <!-- PROFILE IMAGE -->

        <img
            src="sanika.jpg"
            alt="Sanika Salunkhe"
            class="profile-image"
        >


        <!-- NAME -->

        <h1>
            Sanika Salunkhe
        </h1>


        <!-- DEVELOPER TITLE -->

        <p class="developer-title">
            Backend Developer
        </p>


        <!-- LOGIN FORM -->

        <form onsubmit="loginUser(event)">


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>


        </form>


        <!-- BACK TO PORTFOLIO -->

        <a
            href="index.html"
            class="back-home"
        >
            ← Back to Portfolio
        </a>


    </div>


    <!-- LOGIN SCRIPT -->

    <script>

        function loginUser(event) {

            event.preventDefault();

            window.location.href = "home.html";

        }

    </script>


</body>

</html>
