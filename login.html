<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Sanika Salunkhe</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #172554
                );

            color: #e5e7eb;

        }


        /* =========================
           LOGIN BOX
        ========================= */

        .login-container {

            width: 90%;

            max-width: 400px;

            padding: 40px;

            background: #111827;

            border: 1px solid #334155;

            border-radius: 12px;

            box-shadow:
                0 0 30px
                rgba(56, 189, 248, 0.2);

        }


        /* =========================
           TITLE
        ========================= */

        .login-container h1 {

            text-align: center;

            color: #38bdf8;

            margin-bottom: 10px;

        }


        .subtitle {

            text-align: center;

            color: #94a3b8;

            margin-bottom: 30px;

        }


        /* =========================
           FORM
        ========================= */

        .form-group {

            margin-bottom: 20px;

        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            color: #cbd5e1;

        }


        .form-group input {

            width: 100%;

            padding: 13px;

            border: 1px solid #334155;

            border-radius: 7px;

            outline: none;

            background: #1e293b;

            color: white;

            font-size: 1rem;

        }


        .form-group input::placeholder {

            color: #64748b;

        }


        .form-group input:focus {

            border-color: #38bdf8;

            box-shadow:
                0 0 8px
                rgba(56, 189, 248, 0.2);

        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #38bdf8;

            color: #082f49;

            font-size: 1rem;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

        }


        .login-button:hover {

            background: #7dd3fc;

            transform: translateY(-2px);

        }


        /* =========================
           BACK TO PORTFOLIO
        ========================= */

        .back-home {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #38bdf8;

            text-decoration: none;

        }


        .back-home:hover {

            color: #7dd3fc;

        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 500px) {

            .login-container {

                padding: 30px 20px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         LOGIN CONTAINER
    ========================= -->

    <div class="login-container">


        <h1>
            Welcome Back
        </h1>


        <p class="subtitle">
            Login to Sanika's Portfolio
        </p>


        <!-- =========================
             LOGIN FORM
        ========================= -->

        <form
            action="/login"
            method="POST"
        >


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>


        </form>


        <!-- BACK TO PORTFOLIO -->

        <a
            href="index.html"
            class="back-home"
        >
            ← Back to Portfolio
        </a>


    </div>


</body>

</html>
