<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Sanika Salunkhe</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: linear-gradient(
                135deg,
                #0f172a,
                #172554
            );

            color: #e5e7eb;
        }

        .login-container {
            width: 90%;
            max-width: 400px;

            padding: 40px;

            background: #111827;

            border: 1px solid #334155;

            border-radius: 12px;

            box-shadow:
                0 0 30px
                rgba(56, 189, 248, 0.2);
        }

        h1 {
            text-align: center;

            color: #38bdf8;

            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;

            color: #94a3b8;

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #cbd5e1;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #334155;

            border-radius: 7px;

            outline: none;

            background: #1e293b;

            color: white;

            font-size: 1rem;
        }

        input:focus {
            border-color: #38bdf8;
        }

        .login-button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #38bdf8;

            color: #082f49;

            font-size: 1rem;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-button:hover {
            background: #7dd3fc;

            transform: translateY(-2px);
        }

        .back-home {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #38bdf8;
        }

        .back-home:hover {
            color: #7dd3fc;
        }

    </style>

</head>


<body>


    <div class="login-container">

        <h1>
            Welcome Back
        </h1>

        <p class="subtitle">
            Login to Sanika's Portfolio
        </p>


        <!-- LOGIN FORM -->

        <form onsubmit="loginUser(event)">


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>


        </form>


        <a
            href="index.html"
            class="back-home"
        >
            ← Back to Portfolio
        </a>

    </div>


    <script>

        function loginUser(event) {

            event.preventDefault();

            /*
             * Temporary frontend login.
             *
             * Later we can replace this with
             * Node.js backend authentication.
             */

            window.location.href = "home.html";

        }

    </script>


</body>

</html>
